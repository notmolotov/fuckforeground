plugins {
    id 'com.android.application' version '8.2.0'
    id 'kotlin-android' version '1.9.20'
}

android {
    namespace 'com.adam.appblocker'
    compileSdk 34

    defaultConfig {
        applicationId "com.adam.appblocker"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.7'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.1'
    implementation 'androidx.compose.ui:ui:1.6.2'
    implementation 'androidx.compose.material3:material3:1.1.2'
    implementation 'androidx.compose.material:material:1.6.2'
    implementation 'androidx.compose.material-icons-extended:material-icons-extended:1.6.2'
    implementation 'androidx.compose.foundation:foundation:1.6.2'
    implementation 'androidx.compose.runtime:runtime:1.6.2'
    implementation 'androidx.compose.material3:material3-window-size-class:1.1.2'
    implementation 'com.topjohnwu.superuser:core:6.2.1'
    implementation 'com.jakewharton.timber:timber:5.0.1'
}
